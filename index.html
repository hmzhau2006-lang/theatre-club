<style>
:root{
  --teal:#0D6B70; --deep:#06292B; --night:#041517;
  --gold:#C9A25A; --gold-hi:#E8CF8E; --ember:#E0782C; --cream:#EFE7D8;
  --glass:rgba(13,107,112,.22); --glass-2:rgba(13,107,112,.4); --hair:rgba(201,162,90,.35); --muted:rgba(239,231,216,.62);
  --ar:"Tajawal",system-ui,"Segoe UI",sans-serif; --lat:"Montserrat","Tajawal",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--night);color:var(--cream);font-family:var(--ar);font-size:16px;line-height:1.6;overflow-x:hidden}
.stage{position:relative;min-height:100vh;padding-block:40px 80px;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  background:radial-gradient(ellipse 90% 60% at 50% 0%,var(--teal) 0%,var(--deep) 45%,var(--night) 100%) fixed}
.arch-bg{position:fixed;left:50%;top:140px;transform:translateX(-50%);width:min(620px,86vw);height:80vh;pointer-events:none;z-index:0;
  border:1px solid rgba(201,162,90,.16);border-bottom:0;border-radius:50% 50% 0 0/22% 22% 0 0}
.vlabel{position:fixed;left:40px;top:50%;transform:translate(-50%,-50%) rotate(-90deg);
  font-family:var(--lat);font-weight:900;font-size:46px;letter-spacing:8px;white-space:nowrap;pointer-events:none;z-index:0;
  background:linear-gradient(90deg,#9c7535,var(--gold-hi),#9c7535);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:.8}
.dia{position:fixed;pointer-events:none;z-index:0;display:grid;grid-template-columns:repeat(3,14px);gap:10px;transform:rotate(45deg)}
.dia i{width:14px;height:14px;background:rgba(13,107,112,.55)}
.dia i:nth-child(2n){background:rgba(201,162,90,.22)}
.dia.a{top:160px;right:6vw}.dia.b{bottom:100px;left:10vw}
@media (max-width:900px){.vlabel{display:none}}
@media (max-width:600px){.dia{display:none}}

.wrap{position:relative;z-index:2;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:32px;align-items:center}
header{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.logo{height:130px;width:auto}
.title{font-weight:900;font-size:clamp(34px,7vw,50px);line-height:1.2;margin:8px 0 0;text-wrap:balance}
.rule{display:flex;align-items:center;gap:12px;width:min(100%,320px)}
.rule::before,.rule::after{content:"";flex:1;height:2px}
.rule::after{background:linear-gradient(90deg,transparent,var(--gold))}
.rule::before{background:linear-gradient(-90deg,transparent,var(--gold))}
.rule b{width:10px;height:10px;background:var(--ember);transform:rotate(45deg)}
.en{font-family:var(--lat);font-weight:800;font-size:12px;letter-spacing:5px;color:var(--gold)}

.tabs{display:flex;gap:4px;padding:5px;border-radius:14px;border:1px solid var(--hair);background:rgba(4,21,23,.5)}
.tab{font:inherit;font-weight:800;font-size:16px;border:0;background:transparent;color:var(--muted);padding:10px 26px;border-radius:10px;cursor:pointer}
.tab[aria-selected="true"]{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--night)}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}

.panel{width:100%}
.board{width:100%;display:flex;flex-direction:column;gap:14px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.toolbar .grp{display:flex;gap:8px;flex-wrap:wrap}
.note{color:var(--muted);font-size:15px}
.thead{display:grid;grid-template-columns:1fr 170px;gap:12px;padding:12px 22px;border-radius:14px;font-weight:800;font-size:17px;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--night)}
.thead span:last-child{text-align:center}
#rows{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:1fr 170px;gap:12px;align-items:stretch}
.name,.pts{background:var(--glass);border:1px solid rgba(201,162,90,.18);border-radius:14px;min-height:58px;display:flex;align-items:center;padding:0 18px;gap:14px;min-width:0}
.rank{font-family:var(--lat);font-weight:800;color:var(--gold);min-width:30px;text-align:center;font-variant-numeric:tabular-nums}
.nm{font-weight:700;font-size:19px;overflow-wrap:anywhere;min-width:0;flex:1}
.pts{justify-content:center;gap:12px;font-family:var(--lat);font-weight:800;font-size:21px;font-variant-numeric:tabular-nums}
.pts .d{width:9px;height:9px;background:var(--ember);transform:rotate(45deg);flex:none}
.row.r1 .name,.row.r1 .pts{background:var(--glass-2);border-color:var(--gold)}
.medal{display:inline-grid;place-items:center;width:28px;height:28px;transform:rotate(45deg);font-size:13px;color:var(--night)}
.medal span{transform:rotate(-45deg)}
.m1{background:var(--gold-hi)}.m2{background:#c9cfcf}.m3{background:#c78a5a}

.edit .pts{padding:0 8px;gap:6px}
.step{width:34px;height:34px;border-radius:9px;border:1px solid var(--gold);background:transparent;color:var(--gold-hi);font:inherit;font-weight:800;font-size:18px;cursor:pointer;flex:none}
.step:hover{background:var(--gold);color:var(--night)}
.numin{flex:1;width:auto;min-width:0;text-align:center;border:0;background:transparent;font:inherit;font-size:20px;color:inherit;direction:ltr;-moz-appearance:textfield;appearance:textfield;padding:0}
.numin::-webkit-inner-spin-button,.numin::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.edit .row,.edit .thead,.edit .addrow{grid-template-columns:1fr 200px}
.namein{flex:1;min-width:0;border:0;border-bottom:1px dashed var(--hair);background:transparent;font:inherit;font-weight:700;font-size:18px;color:inherit;padding:4px 0}
.del{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:18px;padding:4px}
.del.armed{color:var(--cream);background:#a8361d;border-radius:8px;font-size:13px;padding:4px 10px}

.addrow{display:grid;grid-template-columns:1fr 170px;gap:12px;margin-top:6px}
.addrow input{background:rgba(4,21,23,.5);border:1.5px dashed var(--gold);border-radius:14px;min-height:54px;padding:0 18px;font:inherit;font-size:17px;color:var(--cream);min-width:0}
.btn{font:inherit;font-weight:800;border:0;border-radius:12px;background:var(--ember);color:var(--night);padding:10px 22px;cursor:pointer;min-height:46px}
.btn.ghost{background:transparent;color:var(--gold-hi);border:1.5px solid var(--gold)}
.btn.sm{min-height:38px;padding:6px 14px;font-size:14px}
.empty{text-align:center;padding:36px 16px;color:var(--muted);border-radius:14px;border:1px dashed var(--hair);background:rgba(4,21,23,.4)}

/* ===== Legend card ===== */
.legend-layout{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:32px;align-items:start;width:100%}
.card{position:relative;aspect-ratio:9/16;width:100%;min-height:0;border-radius:24px;overflow:hidden;container-type:inline-size;
  background:radial-gradient(ellipse 85% 50% at 55% 22%,var(--teal),var(--deep) 55%,var(--night) 100%);
  box-shadow:0 24px 50px rgba(0,0,0,.5);color:var(--cream)}
.card .cin{position:absolute;inset:0;display:flex;flex-direction:column;padding:8cqw 8cqw 9cqw 22cqw}
.card .edge{position:absolute;inset:3cqw;border:1px solid rgba(201,162,90,.4);border-radius:18px;pointer-events:none}
.card .vt{position:absolute;left:11cqw;top:50%;transform:translate(-50%,-50%) rotate(-90deg);font-family:var(--lat);font-weight:900;
  font-size:11cqw;letter-spacing:.8cqw;white-space:nowrap;color:var(--gold);line-height:1}
.card .top{display:flex;justify-content:flex-start;align-items:flex-start}
.card .clogo{width:26cqw;height:auto}
.card .arch{position:relative;margin-top:6cqw;flex:1 1 0;min-height:0;border:1px solid rgba(201,162,90,.55);border-bottom:0;
  border-radius:50% 50% 0 0/24% 24% 0 0;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,rgba(13,107,112,.65),transparent 70%)}
.card .arch img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.card .arch::after{content:"";position:absolute;z-index:1;inset:auto 0 0;height:30%;background:linear-gradient(transparent,rgba(4,21,23,.95))}
.card .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:4.4cqw;text-align:center;padding:10%}
.card .body{margin-top:7cqw;display:flex;flex-direction:column;gap:2.6cqw;text-align:right}
.card .kick{display:flex;align-items:center;gap:3cqw}
.card .kick b{width:2.8cqw;height:2.8cqw;background:var(--ember);transform:rotate(45deg);flex:none}
.card .kick span{font-weight:800;color:var(--gold-hi);font-size:5.6cqw;white-space:nowrap}
.card .kick i{flex:1;height:2px;background:linear-gradient(-90deg,var(--gold),transparent)}
.card .lname{font-weight:900;font-size:9.5cqw;line-height:1.25;overflow-wrap:anywhere}
.card .meta{font-weight:500;font-size:5.2cqw;opacity:.9}
.card .quote{font-size:4cqw;color:var(--muted);overflow-wrap:anywhere;line-height:1.6}
.card .quote:empty{display:none}
.card .en2{font-family:var(--lat);font-weight:800;font-size:3cqw;letter-spacing:1.3cqw;color:var(--gold);margin-top:2cqw}
.card .dias{position:absolute;top:9cqw;left:30cqw;display:grid;grid-template-columns:repeat(3,2.6cqw);gap:2cqw;transform:rotate(45deg)}
.card .dias i{width:2.6cqw;height:2.6cqw;background:rgba(201,162,90,.25)}
.card .dias i:first-child{background:var(--ember)}

.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.form{display:flex;flex-direction:column;gap:14px;border:1px solid var(--hair);border-radius:18px;padding:22px;background:rgba(4,21,23,.55)}
.form label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px;color:var(--gold)}
.form input,.form textarea{font:inherit;font-size:16px;color:var(--cream);background:rgba(13,107,112,.18);border:1px solid var(--hair);border-radius:10px;padding:11px 12px;min-width:0}
.form input[type=file]{padding:8px}
[hidden]{display:none!important}
body:not(.admin) .admin-only{display:none!important}
body.admin .viewer-only{display:none!important}
body:not(.admin) .legend-layout{grid-template-columns:minmax(0,400px);justify-content:center}
.admin-bar{width:100%;border:1px dashed var(--ember);border-radius:14px;padding:12px 16px;font-size:14px;line-height:1.8;color:var(--cream);background:rgba(224,120,44,.08)}
.admin-bar b{color:var(--gold-hi)}
.photo-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:-4px}
.btn.armed{background:#a8361d;border-color:#a8361d;color:var(--cream)}
.form textarea{resize:vertical;min-height:80px}
.status{font-size:14px;color:var(--muted);min-height:1.4em}
.hint{font-size:13px;color:var(--muted);line-height:1.7}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:8px}

@media (max-width:720px){
  .legend-layout{grid-template-columns:minmax(0,1fr)}
  .card{max-width:420px;margin:0 auto}
}
@media (max-width:560px){
  .thead,.row,.addrow{grid-template-columns:1fr 116px}
  .edit .row,.edit .thead,.edit .addrow{grid-template-columns:1fr 150px}
  .step{width:28px;height:28px}
  .logo{height:100px}
  .tab{padding:9px 16px}
}
@media (prefers-reduced-motion:no-preference){.row{animation:in .35s ease both}@keyframes in{from{transform:translateY(4px);opacity:.6}}}
</style>
</head>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const KEY = 'theatre-club-v1';
  const arNum = n => Number(n).toLocaleString('ar-SA');
  let state = { members: [], legend: {} };
  let editing = false;

  // Single-owner site: editing is always on, data lives in this browser
  const ADMIN = true;
  document.body.classList.toggle('admin', ADMIN);
  const valid = s => s && Array.isArray(s.members);
  function readLocal(){ try{ const s=JSON.parse(localStorage.getItem(KEY)); return valid(s)?s:null; }catch(e){ return null; } }
  async function readSite(){
    if(location.protocol==='file:') return null;
    try{ const r=await fetch('data.json',{cache:'no-store'}); if(!r.ok) return null; const s=await r.json(); return valid(s)?s:null; }catch(e){ return null; }
  }
  async function load(){
    const local = ADMIN ? readLocal() : null;
    const site = local ? null : await readSite();
    const s = local || site || (ADMIN ? null : readLocal());
    if(s) state = { members: s.members, legend: s.legend || {} };
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); return true; }
    catch(e){ $('#lStatus').textContent = 'المساحة امتلأت، جرّب صورة أصغر.'; return false; }
  }

  // Tabs
  const tabs = [['tab-members','p-members','قائمة الأعضاء','MEMBERS BOARD'],['tab-legend','p-legend','أسطورة الشهر','LEGEND OF THE MONTH']];
  function show(which){
    tabs.forEach(([t,p,label,en],i)=>{const on=i===which;$('#'+t).setAttribute('aria-selected',on);$('#'+p).hidden=!on;if(on){$('#title').textContent=label;$('#titleEn').textContent=en;}});
    history.replaceState(null,'',which?'#legend':'#members');
  }
  $('#tab-members').onclick=()=>show(0); $('#tab-legend').onclick=()=>show(1);

  // Members
  function render(){
    const rows=$('#rows'); rows.innerHTML='';
    $('#board').classList.toggle('edit',editing);
    const ms=state.members;
    $('#mstatus').textContent = ms.length ? arNum(ms.length)+' عضو' : '';
    if(!ms.length){
      const e=document.createElement('div'); e.className='empty';
      e.textContent= ADMIN ? 'لا يوجد أعضاء بعد. اضغط «تعديل القائمة» ثم أضف أول عضو.' : 'القائمة بتنزل قريب.';
      rows.appendChild(e); return;
    }
    const sorted=[...ms].sort((a,b)=>(b.points||0)-(a.points||0)||String(a.name).localeCompare(String(b.name),'ar'));
    let rank=0,prev=null;
    sorted.forEach((m,i)=>{
      if(m.points!==prev){rank=i+1;prev=m.points;}
      const medal=rank<=3&&(m.points||0)>0;
      const row=document.createElement('div'); row.className='row'+(medal&&rank===1?' r1':'');
      const name=document.createElement('div'); name.className='name';
      const r=document.createElement('span'); r.className='rank';
      if(medal){const md=document.createElement('span');md.className='medal m'+rank;const t=document.createElement('span');t.textContent=rank;md.appendChild(t);r.appendChild(md);} else r.textContent=rank;
      name.appendChild(r);
      const pts=document.createElement('div'); pts.className='pts';
      if(editing){
        const inp=document.createElement('input'); inp.className='namein'; inp.value=m.name||''; inp.setAttribute('aria-label','اسم العضو');
        inp.onchange=()=>{const v=inp.value.trim(); if(v){ m.name=v; save(); render(); }};
        name.appendChild(inp);
        const del=document.createElement('button'); del.className='del'; del.type='button'; del.textContent='✕'; del.title='حذف العضو';
        del.onclick=()=>{ if(del.classList.contains('armed')){ state.members=state.members.filter(x=>x!==m); save(); render(); } else { del.classList.add('armed'); del.textContent='تأكيد الحذف'; setTimeout(()=>{del.classList.remove('armed');del.textContent='✕';},3000);} };
        name.appendChild(del);
        const mk=(t,l,fn)=>{const b=document.createElement('button');b.type='button';b.className='step';b.textContent=t;b.setAttribute('aria-label',l);b.onclick=fn;return b;};
        const num=document.createElement('input'); num.className='numin'; num.type='number'; num.inputMode='numeric'; num.value=m.points||0; num.setAttribute('aria-label','النقاط');
        num.onchange=()=>{const v=parseInt(num.value,10); if(!isNaN(v)){ m.points=v; save(); render(); }};
        pts.append(mk('+','إضافة نقطة',()=>{m.points=(m.points||0)+1;save();render();}), num, mk('−','إنقاص نقطة',()=>{m.points=(m.points||0)-1;save();render();}));
      } else {
        const nm=document.createElement('span'); nm.className='nm'; nm.textContent=m.name; name.appendChild(nm);
        const d=document.createElement('span'); d.className='d';
        const v=document.createElement('span'); v.textContent=m.points||0;
        pts.append(d,v);
      }
      row.append(name,pts); rows.appendChild(row);
    });
  }
  $('#editToggle').onclick=()=>{editing=!editing; $('#editToggle').textContent=editing?'تم':'تعديل القائمة'; $('#addForm').hidden=!editing; render(); if(editing) $('#newName').focus();};
  $('#addForm').addEventListener('submit',e=>{
    e.preventDefault(); const name=$('#newName').value.trim(); if(!name) return;
    state.members.push({id:'m'+Date.now().toString(36),name,points:0}); save(); render();
    $('#newName').value=''; $('#newName').focus();
  });

  $('#viewDl').onclick=()=>$('#dlCard').click();
  // Backup
  $('#exportBtn').onclick=()=>{
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='نادي-المسرح-نسخة-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  };
  $('#importFile').onchange=async()=>{
    const f=$('#importFile').files[0]; if(!f) return;
    try{ const s=JSON.parse(await f.text()); if(!Array.isArray(s.members)) throw 0; state={members:s.members,legend:s.legend||{}}; save(); render(); renderLegend(true); $('#mstatus').textContent='تم استرجاع النسخة ✓'; }
    catch(e){ $('#mstatus').textContent='الملف غير صالح. اختر ملف النسخة الاحتياطية (.json).'; }
    $('#importFile').value='';
  };

  // Legend
  function renderLegend(fillForm){
    const L=state.legend;
    $('#cName').textContent=L.name||'اسم الأسطورة';
    const parts=[L.committee,L.month].filter(Boolean);
    $('#cMeta').textContent=parts.length?parts.join(' · '):'اللجنة · الشهر';
    $('#cNote').textContent=L.note||'';
    const arch=$('#arch'); arch.innerHTML='';
    if(L.photo){const im=document.createElement('img');im.src=L.photo;im.alt='صورة '+(L.name||'أسطورة الشهر');arch.appendChild(im);}
    else {const p=document.createElement('div');p.className='ph';p.textContent='ضع صورة الأسطورة هنا';arch.appendChild(p);}
    if(fillForm){ $('#lName').value=L.name||''; $('#lCommittee').value=L.committee||''; $('#lMonth').value=L.month||''; $('#lNote').value=L.note||''; }
    $('#photoActions').hidden = !(L.photo || L.name || L.committee || L.month || L.note);
    $('#rmPhoto').hidden = !L.photo;
  }
  // Two-tap confirm for destructive buttons
  function confirmTap(btn, label, action){
    btn.onclick=()=>{
      if(btn.classList.contains('armed')){ btn.classList.remove('armed'); btn.textContent=label; action(); return; }
      btn.classList.add('armed'); btn.textContent='اضغط مرة ثانية للتأكيد';
      setTimeout(()=>{ btn.classList.remove('armed'); btn.textContent=label; },3000);
    };
  }
  confirmTap($('#rmPhoto'),'حذف الصورة',()=>{
    delete state.legend.photo; $('#lPhoto').value=''; save(); renderLegend(false);
    $('#lStatus').textContent='تم حذف الصورة ✓';
  });
  confirmTap($('#clearCard'),'مسح البطاقة كاملة',()=>{
    state.legend={}; $('#lPhoto').value=''; save(); renderLegend(true);
    $('#lStatus').textContent='تم مسح البطاقة ✓';
  });
  [['lName','name'],['lCommittee','committee'],['lMonth','month'],['lNote','note']].forEach(([id,k])=>$('#'+id).addEventListener('input',e=>{
    state.legend[k]=e.target.value; renderLegend(false); save();
  }));
  // Downscale photo so it fits in browser storage
  $('#lPhoto').onchange=()=>{
    const f=$('#lPhoto').files[0]; if(!f) return;
    const img=new Image(); const url=URL.createObjectURL(f);
    img.onload=()=>{
      const max=1200, s=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      const prev=state.legend.photo; state.legend.photo=c.toDataURL('image/jpeg',.88);
      if(!save()) state.legend.photo=prev; else $('#lStatus').textContent='تم حفظ الصورة ✓';
      renderLegend(false); URL.revokeObjectURL(url); $('#lPhoto').value='';
    };
    img.onerror=()=>{$('#lStatus').textContent='تعذر قراءة الصورة، جرّب صورة ثانية.';};
    img.src=url;
  };
  $('#dlCard').onclick=async()=>{
    const st=$('#lStatus');
    if(!window.html2canvas){ st.textContent='التحميل يحتاج اتصال إنترنت.'; return; }
    st.textContent='جاري تجهيز الصورة…';
    try{
      await document.fonts.ready;
      const canvas=await html2canvas($('#card'),{scale:3,backgroundColor:null,useCORS:true});
      const a=document.createElement('a'); a.href=canvas.toDataURL('image/png');
      a.download='أسطورة-الشهر'+(state.legend.month?'-'+state.legend.month:'')+'.png'; a.click();
      st.textContent='تم تحميل البطاقة ✓';
    }catch(e){ st.textContent='تعذر تحميل البطاقة، خذ لقطة شاشة بدلاً منها.'; }
  };

  render(); renderLegend(true);
  load().then(()=>{ render(); renderLegend(true); });
  if(location.hash==='#legend') show(1);
})();
</script>
</body>
</html>
